resources:
  jobs:
    Open_Data_Portal_Pipeline:
      name: "[${bundle.target}] Open Data Portal Pipeline"
      tags:
        data_origin: open_data_portal
        pipeline: open_data_portal
      schedule:
        quartz_cron_expression: 57 0 1 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED

      # Failure email notifications with run details
      email_notifications:
        on_failure:
          - etai.admi@maryland.gov
      notification_settings:
        no_alert_for_skipped_runs: false

      tasks:
        # Step 1: Discover changes upstream from Socrata portal
        - task_key: Discover_Catalog
          notebook_task:
            notebook_path: ../src/socrata_discovery.ipynb
            base_parameters:
              domain: opendata.maryland.gov
              catalog_name: ${var.catalog_name}
              schema_name: ${var.meta_schema}
              limit: ""
              force_refresh: "false"
              table_name: _socrata_ingestion_queue
              verbose: "true"

          environment_key: python_sodapy

        # Step 2A: Query queued DATA jobs
        - task_key: read_data_queue
          depends_on:
            - task_key: Discover_Catalog
          run_if: ALL_DONE
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/read_data_queue.sql
            parameters:
              catalog_name: ${var.catalog_name}
              meta_schema: ${var.meta_schema}

        # Step 2B: Ingest Data into Bronze Delta Tables
        - task_key: Ingest_Tables
          depends_on:
            - task_key: read_data_queue
          run_if: ALL_DONE
          for_each_task:
            inputs: "{{tasks.read_data_queue.output.rows}}"
            concurrency: 4
            task:
              task_key: Ingest_Tables_iteration
              notebook_task:
                notebook_path: ../src/socrata_ingest_single_table.ipynb
                base_parameters:
                  domain: opendata.maryland.gov          
                  catalog_name: ${var.catalog_name}
                  schema_name: bronze
                  meta_schema: ${var.meta_schema}
                  verbose: "true"
                  payload: "{{input.payload}}"         
              environment_key: python_sodapy

        # Step 3A: Query queued METADATA jobs
        - task_key: read_metadata_queue
          depends_on:
            - task_key: Ingest_Tables
          run_if: ALL_DONE
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/read_metadata_queue.sql
            parameters:
              catalog_name: ${var.catalog_name}
              meta_schema: ${var.meta_schema}

        # Step 3B: Apply table comments, TBLPROPERTIES, tags & column descriptions
        - task_key: Apply_Metadata
          depends_on:
            - task_key: read_metadata_queue
          for_each_task:
            inputs: "{{tasks.read_metadata_queue.output.rows}}"
            concurrency: 4
            task:
              task_key: Apply_Metadata_iteration
              notebook_task:
                notebook_path: ../src/socrata_apply_metadata.ipynb
                base_parameters:
                  domain: opendata.maryland.gov
                  catalog_name: ${var.catalog_name}
                  schema_name: bronze
                  meta_schema: ${var.meta_schema}
                  payload: "{{input.payload}}"
              environment_key: python_sodapy
        
        # Step 4: Verify no silent FAILED/QUARANTINED entries were logged during this run
        - task_key: Check_Pipeline_Failures
          depends_on:
            - task_key: Apply_Metadata
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../src/check_pipeline_failures.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              meta_schema: ${var.meta_schema}
              job_start_time: "{{job.start_time.iso_datetime}}"
          environment_key: python_sodapy

      queue:
        enabled: true
      environments:
        - environment_key: python_sodapy
          spec:
            dependencies:
              - sodapy
              - tenacity
            environment_version: "6"
      performance_target: STANDARD