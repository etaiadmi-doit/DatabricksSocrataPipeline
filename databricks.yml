bundle:
  name: DatabricksSocrataPipeline

include:
  - resources/*.yml

variables:
  catalog_name:
    description: "Target Unity Catalog name for datasets and control metadata"
    default: open_data_portal_dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a7c23b60-14fa.cloud.databricks.com/
    variables:
      catalog_name: open_data_portal_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-4ec94b0b-c1b3.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: open_data_portal