bundle:
  name: DatabricksSocrataPipeline

include:
  - resources/*.yml

variables:
  catalog_name:
    description: "Target Unity Catalog name for datasets and control metadata"
    default: open_data_portal_dev
  meta_schema:
    description: "Control/Audit schema"
    default: meta
  warehouse_id:
    description: "SQL warehouse ID for queue task"
    default: "a3867ded238b86ae"
    
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a7c23b60-14fa.cloud.databricks.com/
      profile: dbc-a7c23b60-14fa
      root_path: ~/Workspace/Users/etai.admi@maryland.gov/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        group_name: datahub-admins
    variables:
      catalog_name: open_data_portal_dev
      meta_schema: meta
      warehouse_id: "a3867ded238b86ae"

  prod:
    mode: production
    workspace:
      host: https://dbc-4ec94b0b-c1b3.cloud.databricks.com
      profile: dbc-4ec94b0b-c1b3
      root_path: /Workspace/Users/etai.admi@maryland.gov/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        group_name: datahub-admins
    variables:
      catalog_name: open_data_portal
      meta_schema: meta
      warehouse_id: "8ff98f058c7e2839"