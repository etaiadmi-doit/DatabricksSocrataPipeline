name: Databricks Pipeline CI/CD

on:
  pull_request:
    branches:
      - main
  # Adds a manual "Run workflow" button in GitHub Actions
  workflow_dispatch:

jobs:
  validate:
    name: Validate Bundle (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.229.0

      - name: Validate Dev Bundle
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-prod:
    name: Deploy to Production (Manual)
    runs-on: ubuntu-latest
    # Only runs when manually triggered via workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.229.0

      - name: Deploy Bundle to Prod
        run: databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}