name: Databricks Pipeline CI/CD

on:
  # PR checks only run bundle validation - nothing is deployed
  pull_request:
    branches:
      - main

  # Manual deployment via the GitHub Actions UI
  workflow_dispatch:
    inputs:
      target_env:
        description: "Choose deployment target"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  validate:
    name: Validate Bundle (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Dev Bundle
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Selected Environment
        run: databricks bundle deploy -t ${{ github.event.inputs.target_env }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}